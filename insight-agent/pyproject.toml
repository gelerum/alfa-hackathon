[project]
name = "insight-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-common==0.1.0",
  "uvicorn>=0.30,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["insight_service*"]

[tool.uv.sources]
agent-common = { path = "../service-common", editable = true }
