name: alpha

include:
  - path: ./application.compose.yaml

services:
  db:
    image: alpha-database:local
    build:
      context: ..
      dockerfile: infrastructure/database.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-alfa_hack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5m

  embeddings:
    build: ../embedding-service
    restart: unless-stopped
    environment:
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-8}
      OMP_NUM_THREADS: ${TORCH_NUM_THREADS:-8}
      MKL_NUM_THREADS: ${TORCH_NUM_THREADS:-8}
      MAX_INPUT_TOKENS: ${MAX_INPUT_TOKENS:-2048}
      HF_HOME: /models
      TOKENIZERS_PARALLELISM: 'false'
    volumes:
      - model_cache:/models
    healthcheck:
      test: ['CMD', '.venv/bin/python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15m

  searxng:
    image: alpha-search:local
    build:
      context: .
      dockerfile: searxng.Dockerfile
      args:
        BASE_IMAGE: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in infrastructure/.env}
      FORCE_OWNERSHIP: 'false'
      SEARXNG_PORT: '8080'
    volumes:
      - searxng_cache:/var/cache/searxng
    healthcheck:
      # Local readiness only; upstream search engines may still reject requests.
      test: ['CMD', '/usr/local/searxng/.venv/bin/python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1m

  qwen-llm:
    profiles: [local-llm]
    image: ${QWEN_IMAGE:-ghcr.io/ggml-org/llama.cpp:server@sha256:5741ab30aae42af23ca57d9b98a6d4544cb09c21f372f92c5ee55312fa8b8b0c}
    restart: unless-stopped
    init: true
    environment:
      LLAMA_API_KEY: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in infrastructure/.env}
    command:
      - --model-url
      - ${QWEN_MODEL_URL:-https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/9280dd353ab587157920d5bd391ada414d84e552/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf}
      - --model
      - /models/qwen3.6-35b-a3b.gguf
      - --alias
      - qwen3.6-35b-a3b
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --ctx-size
      - '${QWEN_CONTEXT_SIZE:-32768}'
      - --parallel
      - '1'
      - --threads
      - '${QWEN_THREADS:-8}'
      - --jinja
      - --no-mmproj
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
    volumes:
      - qwen_model_cache:/models
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 5s
      start_period: 60m
      retries: 5

volumes:
  qwen_model_cache:
  postgres_data:
  model_cache:
  searxng_cache:
