[project]
name = "retrieval-ranking"
version = "0.1.0"
description = "PostgreSQL hybrid news retrieval and CPU Qwen context ranking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
# Research tests remain local and can be invoked explicitly by path.
testpaths = [
    "tests/test_api.py",
    "tests/test_db_unit.py",
    "tests/test_service.py",
    "tests/test_reranker.py",
    "tests/test_text.py",
    "tests/integration",
]
pythonpath = ["."]
markers = [
    "integration: requires the isolated PostgreSQL/pgvector test database",
    "model: downloads and runs the real pinned Qwen model on CPU",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
package = false
required-version = "==0.13.1"
cache-dir = ".cache/uv"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
