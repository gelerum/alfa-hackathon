# Запуск:   docker compose up -d --build     — БД + парсер, который собирает новости постоянно
# Логи:     docker compose logs -f parser
# Один проход без постоянной работы:  docker compose run --rm parser python run_parser.py --once
# Остановить: docker compose down          — данные в БД сохранятся
# Пароль базы берётся из DB_PASSWORD в .env

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
      POSTGRES_DB: alfa_news
    ports:
      - "6770:5432"   # снаружи на 6770, чтобы не пересекаться с локальным PostgreSQL на 6769
    volumes:
      # при первом старте пустой базы postgres сам выполнит init.sql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa_news"]
      interval: 2s
      timeout: 3s
      retries: 30

  parser:
    build: .
    # работает постоянно; после падения или перезагрузки Docker поднимется сам
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://alfa:${DB_PASSWORD}@db:5432/alfa_news
      PARSE_INTERVAL_MINUTES: ${PARSE_INTERVAL_MINUTES:-30}   # пауза между проходами
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
