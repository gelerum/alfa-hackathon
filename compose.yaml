services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-alfa_hack}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./import.sql:/docker-entrypoint-initdb.d/02_import.sql:ro
      - ./df_Uid_data_hack.csv:/csv/df_Uid_data_hack.csv:ro
      - ./df_Uid_payment_hack.csv:/csv/df_Uid_payment_hack.csv:ro
      - ./df_Fid_Uid_link_hack.csv:/csv/df_Fid_Uid_link_hack.csv:ro
    healthcheck:
      # TCP is available only after the entrypoint finishes schema + CSV import.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5m
volumes:
  postgres_data:
