# Запуск:   docker compose run --rm parser   — собрать новости и залить в БД
# БД:       docker compose up -d db          — только поднять базу
# Пароль базы берётся из DB_PASSWORD в .env

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
      POSTGRES_DB: alfa_news
    ports:
      - "6770:5432"   # снаружи на 6770, чтобы не пересекаться с локальным PostgreSQL на 6769
    volumes:
      # при первом старте пустой базы postgres сам выполнит init.sql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa_news"]
      interval: 2s
      timeout: 3s
      retries: 30

  parser:
    build: .
    environment:
      DATABASE_URL: postgresql://alfa:${DB_PASSWORD}@db:5432/alfa_news
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
