# Парсер новостей. БД и embedding-service поднимаются отдельно — из ../infrastructure
# (общая сеть alpha_default), поэтому сначала: cd ../infrastructure && docker compose up -d
#
# Запуск:   docker compose up -d --build     — парсер собирает новости постоянно
# Логи:     docker compose logs -f parser
# Один проход без постоянной работы:  docker compose run --rm parser python run_parser.py --once
# Остановить: docker compose down          — данные в БД не затрагиваются

services:
  parser:
    build: .
    # работает постоянно; после падения или перезагрузки Docker поднимется сам
    restart: unless-stopped
    networks:
      - backend
    environment:
      # те же значения, что в ../infrastructure/.env; из общей сети БД — db:5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-alfa}:${POSTGRES_PASSWORD:-alfa_dev_password}@db:5432/${POSTGRES_DB:-alfa_hack}
      # адрес внутри сети задан явно: EMBEDDING_BASE_URL из .env — для запуска на хосте
      EMBEDDING_BASE_URL: http://embeddings:8000
      # должен совпадать с ключом конфигурации у профайлера
      EMBEDDING_CONFIG_KEY: ${EMBEDDING_CONFIG_KEY:-qwen3-embedding-0.6b@97b0c614:v1}
      EMBED_TIME_BUDGET_MINUTES: ${EMBED_TIME_BUDGET_MINUTES:-20}
      PARSE_INTERVAL_MINUTES: ${PARSE_INTERVAL_MINUTES:-30}   # пауза между проходами

networks:
  backend:
    external: true
    name: ${DOCKER_NETWORK:-alpha_default}
