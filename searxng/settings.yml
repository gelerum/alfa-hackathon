use_default_settings: true

general:
  instance_name: Alpha local search

search:
  default_lang: ru
  formats:
    - html
    - json

server:
  # Private service only: no Redis/Valkey or public-instance bot protection needed.
  limiter: false
  public_instance: false
  image_proxy: false
  # secret_key is supplied via SEARXNG_SECRET, not stored here.

valkey:
  url: false
